[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robosub-vision-toolkit"
version = "2.0.1"
description = "YOLO dataset validation, grouped splits, detection diagnostics and reproducible YOLOv7 run metadata"
requires-python = ">=3.11,<3.14"
dependencies = ["Pillow==12.3.0", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
include = ["robosubvision*"]
